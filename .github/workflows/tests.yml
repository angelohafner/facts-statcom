name: Python tests and SVG validation
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest -q
      - name: Render all SVGs
        run: python -m facts_statcom --all --output-dir output
      - name: Render 13 operating-point SVG charts
        run: python -m facts_statcom.operation --all --output-dir output/operation
