<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" viewBox="0 0 1980 1160" width="1980" height="1160"><title>STATCOM dq control architecture</title><desc>Illustrative cascaded dq control: voltage/reactive, DC energy and current regulation. PLL aligns d-axis with PCC voltage; i_d controls DC energy, i_q controls AC voltage/Q (sign convention dependent).</desc><g id="background" inkscape:groupmode="layer" inkscape:label="Background"><rect x="0" y="0" width="1980" height="1160" rx="0" fill="#F4F7FB" /><rect x="26" y="24" width="1928" height="1112" rx="18" fill="#FFFFFF" stroke="#D9E3ED" /></g><g id="titles" inkscape:groupmode="layer" inkscape:label="Titles and descriptions"><text x="68" y="78" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">STATCOM dq control architecture</text><text x="68" y="113" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Illustrative cascaded dq control: voltage/reactive, DC energy and current regulation</text><line x1="66" y1="135" x2="1914" y2="135" stroke="#D9E3ED" stroke-width="2" stroke-linecap="round" /><line x1="66" y1="1049" x2="1914" y2="1049" stroke="#D9E3ED" stroke-width="2" stroke-linecap="round" /><text x="75" y="1081" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">PLL aligns d-axis with PCC voltage; i_d controls DC energy, i_q controls AC voltage/Q (sign convention dependent).</text><text x="75" y="1109" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Editable SVG | vector symbols | conceptual illustration, not a switching or EMT simulation</text></g><g id="circuit" inkscape:groupmode="layer" inkscape:label="Circuit and devices"><g id="block-pcc-sensors"><rect x="75" y="210" width="240" height="83" rx="12" fill="#F4F7FB" stroke="#D9E3ED" /><text x="195.0" y="240.5" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PCC sensors</text><text x="195.0" y="269.5" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">vabc, iabc</text></g><g id="block-pll"><rect x="420" y="195" width="225" height="92" rx="12" fill="#F4F7FB" stroke="#D9E3ED" /><text x="532.5" y="230.0" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PLL</text><text x="532.5" y="259.0" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">angle θ</text></g><g id="block-abc-→-dq"><rect x="420" y="395" width="225" height="92" rx="12" fill="#F4F7FB" stroke="#D9E3ED" /><text x="532.5" y="430.0" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">abc → dq</text><text x="532.5" y="459.0" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">id, iq</text></g><polyline points="315.000,249.000 420.000,249.000" fill="none" stroke="#24364A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" /><text x="322" y="239" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">vabc</text><polyline points="315.000,260.000 355.000,260.000 355.000,440.000 420.000,440.000" fill="none" stroke="#24364A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" /><polyline points="535.000,287.000 535.000,355.000 540.000,395.000" fill="none" stroke="#24364A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" /><text x="542" y="277" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">θ</text><g id="block-dc-link-sensors"><rect x="80" y="660" width="235" height="95" rx="12" fill="#F4F7FB" stroke="#D9E3ED" /><text x="197.5" y="696.5" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">DC-link sensors</text><text x="197.5" y="725.5" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Vdc measured</text></g><g id="block-dc-link-pi"><rect x="415" y="635" width="240" height="130" rx="12" fill="#F4F7FB" stroke="#D9E3ED" /><text x="535.0" y="689.0" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">DC-link PI</text><text x="535.0" y="718.0" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">i*d reference</text></g><g id="block-pcc-voltage---q-pi"><rect x="415" y="860" width="240" height="130" rx="12" fill="#F4F7FB" stroke="#D9E3ED" /><text x="535.0" y="914.0" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PCC voltage / Q PI</text><text x="535.0" y="943.0" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">i*q reference</text></g><g id="block-setpoint"><rect x="75" y="880" width="250" height="91" rx="12" fill="#F4F7FB" stroke="#D9E3ED" /><text x="200.0" y="914.5" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Setpoint</text><text x="200.0" y="943.5" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">V*pcc or Q*</text></g><polyline points="315.000,710.000 415.000,710.000" fill="none" stroke="#24364A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" /><text x="322" y="700" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Vdc</text><polyline points="325.000,920.000 415.000,920.000" fill="none" stroke="#24364A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" /><text x="327" y="267" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Vpcc → voltage controller</text><polyline points="340.000,835.000 415.000,835.000 415.000,860.000" fill="none" stroke="#24364A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" /><text x="347" y="825" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Vpcc</text><g id="block-dq-current-control"><rect x="875" y="440" width="272" height="140" rx="12" fill="#F4F7FB" stroke="#D9E3ED" /><text x="1011.0" y="499.0" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">dq current control</text><text x="1011.0" y="528.0" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">PI + decoupling / limits</text></g><polyline points="645.000,440.000 875.000,480.000" fill="none" stroke="#24364A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" /><text x="652" y="430" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">id, iq</text><polyline points="655.000,699.000 780.000,699.000 780.000,518.000 875.000,518.000" fill="none" stroke="#24364A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" /><text x="662" y="689" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">i*d</text><polyline points="655.000,924.000 820.000,924.000 820.000,554.000 875.000,554.000" fill="none" stroke="#24364A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" /><text x="662" y="914" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">i*q</text><g id="block-dq-→-abc"><rect x="1300" y="420" width="236" height="137" rx="12" fill="#F4F7FB" stroke="#D9E3ED" /><text x="1418.0" y="477.5" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">dq → abc</text><text x="1418.0" y="506.5" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">voltage references</text></g><polyline points="1147.000,510.000 1300.000,510.000" fill="none" stroke="#24364A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" /><text x="1154" y="500" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">v*d, v*q</text><polyline points="645.000,243.000 1210.000,243.000 1210.000,451.000 1300.000,451.000" fill="none" stroke="#24364A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" /><text x="652" y="233" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">θ</text><g id="block-pwm---gate-drive"><rect x="1620" y="425" width="225" height="111" rx="12" fill="#F4F7FB" stroke="#D9E3ED" /><text x="1732.5" y="469.5" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">PWM / gate drive</text><text x="1732.5" y="498.5" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">switch commands</text></g><polyline points="1536.000,493.000 1620.000,493.000" fill="none" stroke="#24364A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" /><g id="block-three-phase-vsc"><rect x="1620" y="730" width="230" height="115" rx="12" fill="#F4F7FB" stroke="#D9E3ED" /><text x="1735.0" y="776.5" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Three-phase VSC</text><text x="1735.0" y="805.5" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">IGBT converter</text></g><polyline points="1730.000,536.000 1730.000,730.000" fill="none" stroke="#24364A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" /><text x="1737" y="526" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">gating</text><polyline points="1850.000,795.000 1910.000,795.000 1910.000,995.000 55.000,995.000 55.000,250.000 75.000,250.000" fill="none" stroke="#24364A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" /><text x="1857" y="785" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">PCC feedback</text><text x="80" y="1037" fill="#697B90" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">The drawing shows functional signal paths, not a tuned or validated controller. Control polarity depends on dq sign conventions.</text></g><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0,0 L 10,5 L 0,10 z" fill="#24364A" /></marker></defs></svg>